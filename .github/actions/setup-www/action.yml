name: Set up WWW
description: Set up Node.js, pnpm, SQLx CLI, and WWW dependencies

# No browsers: a step that needs one runs inside Playwright's own image through
# run-in-playwright, which brings the browsers and the system libraries they
# need. Installing them here meant apt on every run, and apt once took five
# minutes over a slow mirror.

inputs:
  install-sqlx:
    description: Install SQLx CLI
    required: false
    default: "true"

  node-version:
    description: Node.js version
    required: false
    default: "24"

  pnpm-version:
    description: pnpm version
    required: false
    default: "12"

runs:
  using: composite
  steps:
    - name: Set up SQLx CLI
      if: inputs.install-sqlx == 'true'
      # The version lives in that action, shared with the docs workflow.
      uses: ./.github/actions/setup-sqlx

    - name: Set up pnpm and install WWW dependencies
      uses: ./.github/actions/setup-pnpm
      with:
        working-directory: www
        node-version: ${{ inputs.node-version }}
        pnpm-version: ${{ inputs.pnpm-version }}
