name: Set up WWW
description: Set up Node.js, pnpm, SQLx CLI, and WWW dependencies

inputs:
  install-sqlx:
    description: Install SQLx CLI
    required: false
    default: "true"

  install-playwright:
    description: Install Playwright Chromium and system dependencies
    required: false
    default: "true"

  node-version:
    description: Node.js version
    required: false
    default: "24"

  pnpm-version:
    description: pnpm version
    required: false
    default: "12"

runs:
  using: composite
  steps:
    - name: Set up SQLx CLI
      if: inputs.install-sqlx == 'true'
      # The version lives in that action, shared with the docs workflow.
      uses: ./.github/actions/setup-sqlx

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: www/pnpm-lock.yaml

    - name: Install WWW dependencies
      shell: bash
      working-directory: www
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Chromium
      if: inputs.install-playwright == 'true'
      shell: bash
      working-directory: www
      run: pnpm exec playwright install --with-deps chromium
