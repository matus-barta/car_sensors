# Schema documentation generated by tbls (https://github.com/k1LoW/tbls).
#
# The output in docs/schema/ is generated from a database the migrations have
# been applied to, and must never be edited by hand. Regenerate it from the
# repository root with:
#
#   ./tools/scripts/generate-schema-docs.sh
#
# The connection comes from TBLS_DSN, which that script sets from DATABASE_URL.

name: car_sensors
desc: >-
  Generated from db/migrations by tbls - do not edit. Regenerate with
  ./tools/scripts/generate-schema-docs.sh.

docPath: docs/schema

# schema.json carries the server's full version string, down to the compiler
# and CPU architecture, so it would differ between a developer machine and CI
# and the drift check could never pass.
disableOutputSchema: true

er:
  format: mermaid

exclude:
  - _sqlx_migrations

relations:
  - table: telemetry_samples
    columns:
      - device_id
    parentTable: known_devices
    parentColumns:
      - device_id
    def: "Logical only: there is no foreign key"
