name: WWW - validation

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "www/**"
      - "tools/scripts/sync-www-db-schema.sh"
      - "tools/scripts/cleanup-drizzle-output.js"
      - ".github/workflows/www-validation.yml"

  push:
    branches:
      - main
      - master
    paths:
      - "db/migrations/**"
      - "www/**"
      - "tools/scripts/sync-www-db-schema.sh"
      - "tools/scripts/cleanup-drizzle-output.js"
      - ".github/workflows/www-validation.yml"

permissions:
  contents: read

concurrency:
  group: www-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate WWW project and database schemas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carsensors_schema_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carsensors_schema_check"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/carsensors_schema_check
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-used-in-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-sqlx-cli-0.9.0
          restore-keys: |
            ${{ runner.os }}-sqlx-cli-

      - name: Install SQLx CLI
        shell: bash
        run: |
          if ! command -v sqlx >/dev/null 2>&1; then
            cargo install sqlx-cli \
              --version 0.9.0 \
              --locked \
              --no-default-features \
              --features rustls,postgres
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml

      - name: Install WWW dependencies
        working-directory: www
        run: pnpm install --frozen-lockfile

      - name: Synchronize schemas and validate WWW project
        run: bash tools/scripts/sync-www-db-schema.sh

      - name: Verify required generated schema files
        shell: bash
        run: |
          required_files=(
            "www/src/lib/server/db/generated/schema.ts"
            "www/src/lib/server/db/generated/auth.schema.ts"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required generated schema file is missing:"
              echo
              echo "  $file"
              echo
              exit 1
            fi
          done

      - name: Check generated database schemas
        shell: bash
        run: |
          if ! git diff --exit-code -- \
            www/src/lib/server/db/generated/schema.ts \
            www/src/lib/server/db/generated/auth.schema.ts; then

            echo
            echo "ERROR: Generated database schemas are out of date."
            echo
            echo "The committed SQLx migrations, application schema, or"
            echo "Better Auth configuration do not match the committed"
            echo "generated TypeScript schemas."
            echo
            echo "Run locally from the repository root:"
            echo
            echo "  ./tools/scripts/sync-www-db-schema.sh"
            echo
            echo
            echo "Review and commit:"
            echo
            echo "  www/src/lib/server/db/generated/schema.ts"
            echo "  www/src/lib/server/db/generated/auth.schema.ts"
            echo

            exit 1
          fi

      - name: Reject unexpected generated files
        shell: bash
        run: |
          untracked_files="$(
            git ls-files \
              --others \
              --exclude-standard \
              -- www/src/lib/server/db/generated
          )"

          if [ -n "$untracked_files" ]; then
            echo "ERROR: Unexpected generated files were created:"
            echo
            echo "$untracked_files"
            echo
            echo "Commit required TypeScript schema files or update"
            echo ".gitignore for unused Drizzle migration artifacts."
            exit 1
          fi
