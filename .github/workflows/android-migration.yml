name: Android - migration tests

on:
  # Only when a migration could have changed. An emulator costs minutes rather
  # than seconds, and a Room migration is the one thing here that cannot be
  # decided without one - everything else is tested on the JVM by
  # "Android - validation".
  #
  # That includes the dependencies: room-testing reads the schemas through
  # kotlinx-serialization, whose versions the build file pins for the test
  # classpath, and a mismatch there fails only on a device. Without these two
  # paths a dependency update would merge before anything ran MigrationTest.
  pull_request:
    paths:
      - "android/app/schemas/**"
      - "android/app/src/main/java/com/anonymus09/carsensors/data/AppDatabase.kt"
      - "android/app/src/androidTest/**"
      - "android/gradle/libs.versions.toml"
      - "android/app/build.gradle.kts"
      - ".github/workflows/android-migration.yml"

  # After a merge, on anything under android/. This is where the other devices
  # run - API 28, the level the app targets, and API 33 and 37 - since each is
  # too slow for a pull request to wait on.
  #
  # A merge rather than a schedule, because what this guards against can only
  # arrive with a code change: a calendar fires when nothing has happened and
  # stays quiet when something has. Running after the merge rather than on the
  # pull request means the slower emulator holds nobody up, while still being
  # something that happens on its own.
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - "!android/**/*.md"
      - ".github/workflows/android-migration.yml"

  workflow_call:

  # By hand, from the Actions tab, on any branch - so a change to the emulator
  # setup can be tried on a runner before it is merged rather than after.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Run the migration tests on an emulator
    # Pinned rather than ubuntu-latest, which becomes 26.04 on 2026-10-19 - see
    # "Move the workflows to Ubuntu 26.04" in todo.md.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Read-only: this job restores the Gradle cache but never saves one. With
      # no entry of its own, setup-gradle falls back to the newest entry on the
      # runner's OS, which on main is the validation job's - and that job
      # builds the instrumented test APK precisely so its entry already holds
      # what this one needs. Saving here as well wrote a fresh third of a
      # gigabyte on every dependency change, and the repository's cache was
      # over its limit, evicting other workflows' caches to make room.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The runners ship the SDK with most licences accepted, but not the one
      # for the ATD system image, and Gradle cannot install a package whose
      # licence it has not been given. Accepting them all is cheap and is what
      # the failure message itself asks for.
      # `|| true` because `yes` is killed by SIGPIPE once sdkmanager stops
      # reading, which some shells report as a failure. A licence that genuinely
      # could not be accepted still fails loudly further down, where Gradle says
      # exactly which package it was.
      - name: Accept the Android SDK licences
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The runners ship no emulator. Gradle never installs one by name: it
      # arrives only as a dependency of a system image, and API 28's image
      # declares no such dependency. AGP then fails setting the device up, with
      # "Cannot query the value of this property because it has no value
      # available" - nothing that names the emulator.
      #
      # Neither the emulator nor the system image is cached. A cache step here
      # never saved anything - its paths did not exist on the runner - and a
      # working one would hold up to 2 GB per image in a repository cache that
      # is already full. Downloading takes under a minute, even for API 37's.
      - name: Install the Android emulator
        working-directory: .
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator'

      # Without this the emulator falls back to software emulation and takes
      # long enough to be worth avoiding. The runners have KVM; the device node
      # just is not readable by the job's user by default.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Setting the device up - downloading its system image, creating it and
      # booting it once - is what the test task does first anyway. It is a step
      # of its own so that it alone can be retried: a download once arrived
      # corrupt, failing a run that had nothing wrong with it. The tests are
      # never retried, so a flaky test still fails.
      - name: Set up the device
        run: |
          for attempt in 1 2 3; do
            ./gradlew api30atdSetup \
              -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
              --stacktrace && exit 0
            echo "::warning::Setting up api30atd failed (attempt $attempt of 3)"
          done
          exit 1

      # The device is declared in build.gradle.kts rather than here, so this is
      # the same command a developer runs, and Gradle can skip it entirely when
      # nothing it depends on has changed.
      # Only the ATD device here, because it is the quick one; the slower
      # devices run after a merge, in the job below.
      #
      # --stacktrace because a failure that happens only on a runner has to be
      # diagnosable from the log it produces the first time.
      - name: Run migration tests
        run: >-
          ./gradlew api30atdDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-migration-report
          path: android/app/build/reports/androidTests/
          retention-days: 7

  # The other levels, after a merge only: API 28, the level the app targets and
  # the handset runs, and API 33 and 37, where the platform changes this app's
  # behaviour whatever it targets - 33 made notifications a permission, 37 is
  # the newest. Each costs several minutes a pull request should not have to
  # wait for; after the merge it holds nobody up, while still being something
  # that happens on its own.
  #
  # A job of its own rather than a matrix on the one above, so that job keeps
  # its name - pull requests may be required to pass it under that name.
  #
  # API 28's device failed to set itself up here until the emulator was
  # installed explicitly - see that step. Its own runner means a failure costs
  # only its own result.
  newer-android:
    name: Run the instrumented tests on ${{ matrix.device }}
    if: github.event_name != 'pull_request'
    # Pinned rather than ubuntu-latest, which becomes 26.04 on 2026-10-19 - see
    # "Move the workflows to Ubuntu 26.04" in todo.md.
    runs-on: ubuntu-24.04

    strategy:
      # One version failing says nothing about the other.
      fail-fast: false
      matrix:
        device: [api28, api33atd, api37]

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # As above: read-only, restoring the validation job's entry.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # As above: the runners do not accept every system image's licence.
      - name: Accept the Android SDK licences
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # As above: the runners ship no emulator, and API 28's image does not
      # bring one.
      - name: Install the Android emulator
        working-directory: .
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator'

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # As above: only the setup is retried, never the tests.
      - name: Set up the device
        run: |
          for attempt in 1 2 3; do
            ./gradlew ${{ matrix.device }}Setup \
              -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
              --stacktrace && exit 0
            echo "::warning::Setting up ${{ matrix.device }} failed (attempt $attempt of 3)"
          done
          exit 1

      - name: Run the instrumented tests
        run: >-
          ./gradlew ${{ matrix.device }}DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-instrumented-report-${{ matrix.device }}
          path: android/app/build/reports/androidTests/
          retention-days: 7
