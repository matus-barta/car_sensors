name: WWW - build

on:
  push:
    branches:
      - main
      - master
    paths:
      - "www/**"
      # The generated Drizzle schema is committed, but a migration changing
      # without it would mean the image ships a schema the database does not
      # have - so the checks run on both.
      - "db/migrations/**"
      - ".github/actions/setup-www/**"
      - ".github/workflows/www-build.yml"
      - ".github/workflows/www-validation.yml"
      - "!www/**/*.md"

permissions:
  contents: read

jobs:
  validate:
    name: Validate before publishing
    uses: ./.github/workflows/www-validation.yml

  build:
    needs: validate

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/car-sensors-www
          tags: |
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=Car Sensors Web
            org.opencontainers.image.description=Administration and map visualisation for the fleet
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.authors=Matus Barta

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./www
          file: ./www/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Native GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
