name: Set up SQLx CLI
description: Install the SQLx CLI, the only tool allowed to apply db/migrations

inputs:
  sqlx-version:
    description: SQLx CLI version
    required: false
    default: "0.9.0"

runs:
  using: composite
  steps:
    # Before Rust, so a hit needs no toolchain at all: the cached binary runs
    # on its own, and installing Rust only to find it was ten seconds of every
    # job that uses this.
    - name: Cache SQLx CLI
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-sqlx-cli-${{ inputs.sqlx-version }}
        restore-keys: |
          ${{ runner.os }}-sqlx-cli-

    # Only to build the CLI: no components, and no workspace cache, which is
    # what a Rust job proper would want and this one would never use. A
    # restore-keys hit is a miss here too - it brings an older CLI back.
    - name: Set up Rust
      if: steps.cache.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Install SQLx CLI
      shell: bash
      env:
        SQLX_VERSION: ${{ inputs.sqlx-version }}
      run: |
        # Set up Rust puts this on PATH when it runs; on a hit it does not.
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"

        # Missing, or an older version that restore-keys brought back.
        if [[ "$(sqlx --version 2>/dev/null)" != *"$SQLX_VERSION"* ]]; then
          cargo install sqlx-cli \
            --version "$SQLX_VERSION" \
            --locked \
            --force \
            --no-default-features \
            --features rustls,postgres
        fi

        installed_version="$(sqlx --version)"
        echo "Using $installed_version"

        if [[ "$installed_version" != *"$SQLX_VERSION"* ]]; then
          echo "ERROR: Expected SQLx CLI version $SQLX_VERSION."
          exit 1
        fi
