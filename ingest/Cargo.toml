[package]
name = "ingest"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/matus-barta/car_sensors"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
serde = { version = "1.0", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "fs",
    "trace",
    "decompression-gzip",
    "limit",
    "cors",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = "0.23"
thiserror = "2.0"
dotenvy = "0.15"
sha2 = "0.11"
subtle = "2.6"
clap = { version = "4.6", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
reqwest = { version = "0.13", default-features = false }
shared = { path = "../shared" }
# preserve_order keeps fields in declaration order in the generated document,
# so it reads id, event, timestamp first rather than alphabetically.
utoipa = { version = "6.0.0", features = ["preserve_order", "preserve_path_order"] }
serde_json = "1.0.151"

[dev-dependencies]
axum = "0.8"
flate2 = "1.1"
# Without its defaults, which fetch remote $refs over HTTP and from disk: the
# tests resolve every reference inside the document they validate.
jsonschema = { version = "0.58.5", default-features = false }
shared = { path = "../shared" }
tower = { version = "0.5", features = ["util"] }
