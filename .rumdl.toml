# rumdl - the Markdown linter and formatter for every Markdown file in the
# repository. It is installed as a development dependency of the documentation
# site and run from there (`pnpm lint:md`, `pnpm format:md` in docs/starlight),
# and CI runs the same pinned version in docs-validation.yml. Rules are
# markdownlint's, numbered the same; https://rumdl.dev/ documents each one.

[global]
# Line length: prose here is written both wrapped and as one line per
# paragraph, and both read the same on GitHub and on the site.
disable = ["MD013"]

# Files ignored by git are skipped as well - node_modules, build output.
exclude = [
	# Instructions for agents rather than documents for people.
	".claude/",
	# Vendored skills, managed by the skills CLI and never edited here.
	".agents/",
	# Generated by tbls from the migrated database.
	"docs/schema/",
]

# Inline HTML: none, except what showing a different image to each theme needs.
# GitHub has no Markdown for that, only a <picture> with a <source> per colour
# scheme around the <img> - the README's screenshot uses it.
# https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/quickstart-for-writing-on-github
[MD033]
allowed-elements = ["picture", "source", "img"]
