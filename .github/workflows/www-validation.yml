name: WWW - validation

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "www/**"
      - "tools/scripts/sync-www-db-schema.sh"
      - "tools/scripts/cleanup-drizzle-output.js"
      - ".github/actions/setup-www/**"
      - ".github/workflows/www-validation.yml"

  push:
    branches:
      - main
      - master
    paths:
      - "db/migrations/**"
      - "www/**"
      - "tools/scripts/sync-www-db-schema.sh"
      - "tools/scripts/cleanup-drizzle-output.js"
      - ".github/actions/setup-www/**"
      - ".github/workflows/www-validation.yml"

permissions:
  contents: read

concurrency:
  group: www-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate WWW project and database schemas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carsensors_schema_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carsensors_schema_check"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/carsensors_schema_check
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-used-in-production
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up WWW environment
        uses: ./.github/actions/setup-www

      - name: Synchronize schemas and validate WWW project
        run: bash tools/scripts/sync-www-db-schema.sh

      - name: Run formatting and lint checks
        working-directory: www
        run: pnpm lint

      - name: Run unit and component tests
        working-directory: www
        run: pnpm test:unit --run

      - name: Verify required generated schema files
        shell: bash
        run: |
          required_files=(
            "www/src/lib/server/db/generated/schema.ts"
            "www/src/lib/server/db/generated/auth.schema.ts"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required generated schema file is missing:"
              echo
              echo "  $file"
              echo
              exit 1
            fi
          done

      - name: Check generated database schemas
        shell: bash
        run: |
          if ! git diff --exit-code -- \
            www/src/lib/server/db/generated/schema.ts \
            www/src/lib/server/db/generated/auth.schema.ts; then

            echo
            echo "ERROR: Generated database schemas are out of date."
            echo
            echo "The committed SQLx migrations, application schema, or"
            echo "Better Auth configuration do not match the committed"
            echo "generated TypeScript schemas."
            echo
            echo "Run locally from the repository root:"
            echo
            echo "  ./tools/scripts/sync-www-db-schema.sh"
            echo
            echo "Review and commit:"
            echo
            echo "  www/src/lib/server/db/generated/schema.ts"
            echo "  www/src/lib/server/db/generated/auth.schema.ts"
            echo

            exit 1
          fi

      - name: Reject unexpected generated files
        shell: bash
        run: |
          untracked_files="$(
            git ls-files \
              --others \
              --exclude-standard \
              -- www/src/lib/server/db/generated
          )"

          if [ -n "$untracked_files" ]; then
            echo "ERROR: Unexpected generated files were created:"
            echo
            echo "$untracked_files"
            echo
            echo "Commit required TypeScript schema files or update"
            echo ".gitignore for unused Drizzle migration artifacts."
            exit 1
          fi

  e2e:
    name: Run end-to-end tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/carsensors_e2e_test
      POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ORIGIN: http://127.0.0.1:4173
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-used-in-production
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up WWW environment
        uses: ./.github/actions/setup-www

      - name: Run end-to-end tests
        working-directory: www
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: www-playwright-report
          path: www/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: www-playwright-test-results
          path: www/test-results/
          if-no-files-found: ignore
          retention-days: 14
