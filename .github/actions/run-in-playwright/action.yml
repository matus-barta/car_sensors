name: Run in Playwright's image
description: Run a command inside Playwright's own Docker image, which carries the browsers and the system libraries they need

# Instead of installing browsers on the runner, which means apt on every run,
# and apt once took five minutes over a slow mirror. Playwright advises
# against caching the browsers themselves, since the system libraries cannot
# be cached with them: https://playwright.dev/docs/ci
#
# Only the command runs in the image. Everything set up before it - the
# dependencies, the SQLx CLI, the Postgres service - stays on the runner and
# is reached from inside: the workspace is mounted at the same path, the SQLx
# binary is mounted in, and the network is the runner's own.

inputs:
  run:
    description: The command to run, through bash
    required: true

  working-directory:
    description: Where to run it - a package whose node_modules holds the playwright package
    required: false
    default: www

  env:
    description: Names of the environment variables to pass into the image, one per line
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run in Playwright's image
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUN: ${{ inputs.run }}
        ENV_NAMES: ${{ inputs.env }}
      run: |
        # The image whose browsers this lockfile's Playwright looks for: with
        # any other version it cannot find them. Read from what was installed,
        # so a dependency update moves the image with it.
        version="$(node -p "require('./node_modules/playwright/package.json').version")"
        image="mcr.microsoft.com/playwright:v${version}-noble"

        # Retried on its own, like an emulator's setup: a pull is a download,
        # and a download can fail with nothing wrong in the change.
        for attempt in 1 2 3; do
          docker pull --quiet "$image" && break
          echo "::warning::Pulling $image failed (attempt $attempt of 3)"
          [[ $attempt == 3 ]] && exit 1
        done

        env_args=()
        for name in $ENV_NAMES; do
          env_args+=(--env "$name")
        done

        sqlx_args=()
        if sqlx_path="$(command -v sqlx)"; then
          sqlx_args=(--volume "$sqlx_path:/usr/local/bin/sqlx:ro")
        fi

        # As the runner's user, so what the command writes - reports, build
        # output - belongs to the steps after it. --ipc=host because Chromium
        # can otherwise run out of shared memory: https://playwright.dev/docs/docker
        # The image has Node.js but not pnpm, so the version the dependencies
        # were installed with is added first.
        docker run --rm \
          --network host \
          --ipc=host \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp \
          --env CI \
          --env RUN \
          --env PNPM_VERSION="$(pnpm --version)" \
          "${env_args[@]}" \
          "${sqlx_args[@]}" \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          --workdir "$PWD" \
          "$image" \
          bash -eo pipefail -c '
            npm install --global --prefix /tmp/tools --no-audit --no-fund --loglevel=error "pnpm@$PNPM_VERSION"
            export PATH="/tmp/tools/bin:$PATH"
            eval "$RUN"
          '
