name: Android - validation

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/actions/setup-android/**"
      - ".github/workflows/android-validation.yml"
      - "!android/**/*.md"

  # Also after a merge, as "WWW - validation" does. Partly so a bad merge is
  # caught, and partly because caches are only shared between branches when
  # they were written on the default one - without this every pull request
  # would fetch its dependencies, its Gradle caches and its Robolectric
  # runtimes from cold and then throw them away.
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/actions/setup-android/**"
      - ".github/workflows/android-validation.yml"
      - "!android/**/*.md"

  # Called by a release workflow rather than triggering on the push itself, so
  # a build is only published once these checks have passed - the same shape
  # "Ingest - build" uses for the image.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the Android app
    # Pinned rather than ubuntu-latest, which becomes 26.04 on 2026-10-19 - see
    # docs/tasks/move-the-workflows-to-ubuntu-26-04.md.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The one Android job that saves the Gradle cache; the others only
      # restore it. That also keeps a re-run cheap on a pull request that has
      # not changed anything the build depends on.
      - name: Set up Android
        uses: ./.github/actions/setup-android

      # Robolectric downloads an `android-all` jar for each SDK level it is
      # asked to emulate, the first time it needs one - into the local Maven
      # repository, which is not somewhere setup-gradle looks. That is a few
      # hundred megabytes fetched on every run if it is not kept.
      - name: Cache the Robolectric runtimes
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      # No local.properties is written: it is deliberately not in the
      # repository, and the runners already export ANDROID_HOME.

      # Cheapest first, so the quickest thing to fix is the first thing
      # reported. ktlint is formatting, detekt is the static analysis the
      # Kotlin side previously had no counterpart to www's ESLint for, and
      # Android lint catches the platform-specific mistakes neither can see.
      - name: Check formatting and static analysis
        run: ./gradlew ktlintCheck detekt lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Both variants, because they genuinely differ here: the debug manifest
      # permits cleartext and BuildConfig.DEBUG decides whether the server
      # address field accepts http, so a release-only break would otherwise go
      # unnoticed until someone tried to publish one. Release is unsigned,
      # which needs no key and still exercises the manifest merge and dexing.
      #
      # The instrumented test APK too, for two reasons. The tests only run on
      # an emulator, in "Android - migration tests", which a pull request
      # triggers only for some paths - so without this, a change that stops
      # them compiling could pass here. And this is the one Android job that
      # saves the Gradle cache: the emulator jobs only restore it, so it has to
      # hold what they need.
      - name: Assemble both variants and the instrumented tests
        run: ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest

      # Room writes the database schema to app/schemas/ whenever it compiles
      # (room.schemaLocation in app/build.gradle.kts), and the migration tests
      # read those files to build each old version of the database. A schema
      # change that was never committed would leave them testing migrations
      # against a schema the app no longer has, so the build above must not
      # have changed or added any.
      - name: Check the exported Room schema
        shell: bash
        run: |
          untracked_files="$(git ls-files --others --exclude-standard -- app/schemas)"

          if ! git diff --exit-code -- app/schemas || [ -n "$untracked_files" ]; then
            if [ -n "$untracked_files" ]; then
              echo
              echo "New schema files that are not committed:"
              echo
              echo "$untracked_files"
            fi

            echo
            echo "ERROR: Room's exported schema is out of date."
            echo
            echo "android/app/schemas/ no longer matches the entities the app"
            echo "compiles. Build the app locally, then review and commit"
            echo "android/app/schemas/."
            echo

            exit 1
          fi

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/ktlint/
            android/app/build/reports/detekt/
            android/app/build/reports/lint-results-debug.html
          retention-days: 7
