[package]
name = "ingest"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/matus-barta/car_sensors"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
serde = { version = "1.0", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "fs",
    "trace",
    "decompression-gzip",
    "limit",
    "cors",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = "0.23"
thiserror = "2.0"
dotenvy = "0.15"
shared = { path = "../shared" }

[dev-dependencies]
axum = "0.8"
flate2 = "1.1"
shared = { path = "../shared" }
tower = { version = "0.5", features = ["util"] }
