name: Set up pnpm
description: Set up Node.js and pnpm and install one package's dependencies from its lockfile

inputs:
  working-directory:
    description: The package to install, a directory holding package.json and pnpm-lock.yaml
    required: true

  node-version:
    description: Node.js version
    required: false
    default: "24"

  pnpm-version:
    description: pnpm version
    required: false
    default: "12"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
